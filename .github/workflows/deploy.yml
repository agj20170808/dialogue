name: Build and Deploy Dialogue Index

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build _site and generate index.html
        run: |
          python3 - <<'PY'
          import datetime
          import html
          import os
          import re
          import shutil
          import subprocess
          import textwrap
          import urllib.parse

          OUT_DIR = "_site"
          if os.path.exists(OUT_DIR):
              shutil.rmtree(OUT_DIR)

          shutil.copytree(
              ".",
              OUT_DIR,
              ignore=shutil.ignore_patterns(".git", ".github", OUT_DIR),
          )

          kst = datetime.timezone(datetime.timedelta(hours=9))
          entries = []

          for root, dirs, files in os.walk("."):
              dirs[:] = sorted(
                  d for d in dirs if d not in {".git", ".github", OUT_DIR, "node_modules"}
              )
              if root == ".":
                  continue
              if "index.html" not in files:
                  continue

              rel_dir = os.path.relpath(root, ".").replace(os.sep, "/")
              file_path = os.path.join(root, "index.html")

              with open(file_path, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()

              m = re.search(r"<title[^>]*>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
              title = html.unescape(m.group(1)).strip() if m else rel_dir
              if not title:
                  title = rel_dir

              ts = 0
              date_str = ""
              try:
                  res = subprocess.run(
                      ["git", "log", "-1", "--format=%ct", "--", file_path],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  out = res.stdout.strip()
                  if out.isdigit():
                      ts = int(out)
                      date_str = datetime.datetime.fromtimestamp(ts, kst).strftime("%Y-%m-%d %H:%M")
              except Exception:
                  pass

              entries.append({
                  "dir": rel_dir,
                  "title": title,
                  "ts": ts,
                  "date": date_str,
              })

          entries.sort(key=lambda x: (-x["ts"], x["dir"]))

          cards_html = []
          for item in entries:
              href = "/".join(urllib.parse.quote(p) for p in item["dir"].split("/")) + "/"
              title_esc = html.escape(item["title"])
              dir_esc = html.escape(item["dir"])
              date_esc = html.escape(item["date"]) if item["date"] else "날짜 없음"
              cards_html.append(
                  f'      <a class="card" href="{href}" data-search="{dir_esc.lower()} {title_esc.lower()}">\n'
                  f'        <div class="card-top">\n'
                  f'          <span class="slug">/{dir_esc}</span>\n'
                  f'          <span class="date">{date_esc}</span>\n'
                  f'        </div>\n'
                  f'        <div class="title">{title_esc}</div>\n'
                  f'      </a>'
              )

          list_markup = (
              "\n".join(cards_html)
              if cards_html
              else '      <div class="empty">아직 등록된 대화 페이지가 없습니다. 하위 폴더에 <code>index.html</code>을 추가해 보세요.</div>'
          )

          now_kst = datetime.datetime.now(kst).strftime("%Y-%m-%d %H:%M KST")

          template = textwrap.dedent("""\
          <!DOCTYPE html>
          <html lang="ko">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Dialogue Archive · 목차</title>
          <style>
            :root{
              --bg:#b2c7d9;
              --card:#ffffff;
              --accent:#fef01b;
              --text:#111;
              --meta:#5a6b7b;
            }
            *{box-sizing:border-box;}
            body{
              margin:0;
              font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
              background:var(--bg);
              color:var(--text);
              line-height:1.5;
            }
            .app{
              max-width:820px;
              margin:0 auto;
              min-height:100vh;
              display:flex;
              flex-direction:column;
            }
            header{
              position:sticky;top:0;z-index:10;
              background:#a1b8cc;
              padding:14px 18px;
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:10px;
              border-bottom:1px solid #90a9bf;
              box-shadow:0 1px 4px rgba(0,0,0,.08);
            }
            header h1{
              margin:0;
              font-size:16px;
              font-weight:800;
              color:#1b2b3a;
            }
            .count{
              background:var(--accent);
              color:#111;
              font-size:12px;
              font-weight:800;
              padding:3px 10px;
              border-radius:999px;
              white-space:nowrap;
            }
            .main{
              flex:1;
              padding:16px 14px 48px;
              display:flex;
              flex-direction:column;
              gap:12px;
            }
            .search{
              width:100%;
              padding:10px 14px;
              border:1px solid #90a9bf;
              border-radius:12px;
              font-size:14px;
              background:#f8fbfe;
              outline:none;
            }
            .search:focus{
              border-color:#0a4d8c;
              background:#fff;
            }
            .list{
              display:flex;
              flex-direction:column;
              gap:10px;
            }
            .card{
              display:block;
              text-decoration:none;
              color:inherit;
              background:var(--card);
              border-radius:14px;
              padding:13px 16px;
              box-shadow:0 1px 2px rgba(0,0,0,.07);
              transition:transform .08s ease, box-shadow .12s ease;
            }
            .card:hover{
              transform:translateY(-1px);
              box-shadow:0 4px 10px rgba(0,0,0,.1);
            }
            .card-top{
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:8px;
              margin-bottom:4px;
            }
            .slug{
              font-family:Consolas,"Courier New",monospace;
              font-size:12px;
              color:#0a4d8c;
              background:#eef4fa;
              padding:1px 7px;
              border-radius:6px;
            }
            .date{
              font-size:11.5px;
              color:var(--meta);
              white-space:nowrap;
            }
            .title{
              font-size:15px;
              font-weight:700;
            }
            .empty{
              background:#fff;
              border-radius:14px;
              padding:20px;
              text-align:center;
              color:var(--meta);
              font-size:14px;
            }
            footer{
              text-align:center;
              padding:10px;
              font-size:11px;
              color:#3a5064;
              background:#a1b8cc;
            }
          </style>
          </head>
          <body>
          <div class="app">
            <header>
              <h1>Dialogue Archive · 대화 목록</h1>
              <span class="count">총 __COUNT__개</span>
            </header>
            <div class="main">
              <input id="q" class="search" type="search" placeholder="제목 또는 폴더명으로 검색..." autocomplete="off">
              <div id="list" class="list">
          __LIST__
              </div>
            </div>
            <footer>마지막 자동 갱신: __NOW__</footer>
          </div>
          <script>
            const q = document.getElementById("q");
            const cards = Array.from(document.querySelectorAll("#list .card"));
            q.addEventListener("input", () => {
              const term = q.value.trim().toLowerCase();
              for (const c of cards) {
                c.style.display = !term || c.dataset.search.includes(term) ? "" : "none";
              }
            });
          </script>
          </body>
          </html>
          """)

          index_html = (
              template.replace("__COUNT__", str(len(entries)))
              .replace("__LIST__", list_markup)
              .replace("__NOW__", now_kst)
          )

          with open(os.path.join(OUT_DIR, "index.html"), "w", encoding="utf-8") as f:
              f.write(index_html)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
